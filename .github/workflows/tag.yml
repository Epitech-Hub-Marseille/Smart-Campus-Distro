# Tags every commit pushed to main as v<major>.<minor>.<patch> (see tools/next_version.py).
# Machines follow these tags: sc-update installs the latest one.
name: tag

on:
  push:
    branches: [main]

# Two quick pushes must not compute their tags at the same time.
concurrency:
  group: tag-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the patch number counts commits, so it needs the history

      - name: Tests
        run: python3 -m unittest discover -s tests

      - name: Tag this commit
        run: |
          version="v$(python3 tools/next_version.py)"
          if git rev-parse --verify --quiet "refs/tags/$version" >/dev/null; then
            echo "$version already exists, nothing to do"
            exit 0
          fi
          git tag "$version"
          git push origin "$version"
