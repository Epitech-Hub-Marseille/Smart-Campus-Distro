# Faculty screen: the agent runs in Docker, Chromium shows its page full screen.
PRODUCT_TITLE="Faculty screen"
PRODUCT_REPO_URL="https://github.com/liam-colle/SmartCampus-FacultyScreens.git"
PRODUCT_HAS_SCREEN="yes"
PRODUCT_PACKAGES="curl"
# The agent only lets the page of http://localhost:<port> open its socket,
# so the kiosk must use "localhost", not 127.0.0.1.
PRODUCT_KIOSK_URL="http://localhost:3000/"
